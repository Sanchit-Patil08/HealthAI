<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — HealthAI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫀</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><i class="bi bi-heart-pulse-fill" style="color:var(--c-primary);"></i> HealthAI</div>
    <p style="text-align:center;color:var(--c-text-3);font-size:0.875rem;margin-bottom:2rem;">
      Create your free account in seconds
    </p>

    {% with messages = get_flashed_messages(with_categories=True) %}
      {% for cat, msg in messages %}
      <div class="alert-ai alert-ai-{{ cat }} mb-3">
        <i class="bi bi-info-circle alert-icon"></i> {{ msg }}
      </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="form-ai">
      <div class="field-group">
        <label class="field-label">Full Name</label>
        <input type="text" name="name" class="input-ai" placeholder="Alex Johnson" required>
      </div>
      <div class="field-group">
        <label class="field-label">Email Address</label>
        <input type="email" name="email" class="input-ai" placeholder="you@example.com" required>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input type="password" name="password" class="input-ai" placeholder="Min. 8 characters" required minlength="6">
      </div>
      <div style="background:var(--c-surface-2);border-radius:var(--radius-sm);padding:0.75rem;font-size:0.78rem;color:var(--c-text-3);">
        <i class="bi bi-shield-check" style="color:var(--c-success);"></i>
        Your data is stored securely. We never share your health information.
      </div>
      <button type="submit" class="btn-ai btn-primary-ai w-100 justify-content-center" style="font-size:0.95rem;padding:0.7rem;">
        <i class="bi bi-person-check-fill"></i> Create Account
      </button>
    </form>

    <div class="text-center mt-3">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
    <div class="text-center mt-2">
      <a href="{{ url_for('auth.index') }}" style="font-size:0.8rem;color:var(--c-text-4);">← Back to home</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
