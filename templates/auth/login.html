<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HealthAI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫀</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='/main.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><i class="bi bi-heart-pulse-fill" style="color:var(--c-primary);"></i> HealthAI</div>
    <p style="text-align:center;color:var(--c-text-3);font-size:0.875rem;margin-bottom:2rem;">
      Welcome back — sign in to your account
    </p>

    {% with messages = get_flashed_messages(with_categories=True) %}
      {% for cat, msg in messages %}
      <div class="alert-ai alert-ai-{{ cat }} mb-3">
        <i class="bi bi-x-circle alert-icon"></i> {{ msg }}
      </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="form-ai">
      <div class="field-group">
        <label class="field-label">Email Address</label>
        <input type="email" name="email" class="input-ai" placeholder="you@example.com" required>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input type="password" name="password" class="input-ai" placeholder="••••••••" required>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <label style="font-size:0.82rem;color:var(--c-text-3);cursor:pointer;">
          <input type="checkbox" name="remember" style="margin-right:4px;"> Remember me
        </label>
        <a href="#" style="font-size:0.82rem;">Forgot password?</a>
      </div>
      <button type="submit" class="btn-ai btn-primary-ai w-100 justify-content-center" style="font-size:0.95rem;padding:0.7rem;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

    <div class="divider" style="margin:1.5rem 0;text-align:center;position:relative;">
      <span style="background:var(--c-surface);padding:0 0.75rem;font-size:0.8rem;color:var(--c-text-4);position:relative;z-index:1;">
        Don't have an account?
      </span>
    </div>
    <a href="{{ url_for('auth.signup') }}" class="btn-ai btn-outline-ai w-100 justify-content-center">
      <i class="bi bi-person-plus"></i> Create Account
    </a>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.index') }}" style="font-size:0.8rem;color:var(--c-text-4);">
        ← Back to home
      </a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
